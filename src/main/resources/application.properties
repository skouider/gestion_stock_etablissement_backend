spring.application.name=projet_gestiob_stock_CIC

# ===============================
# =   CONFIGURATION DE LA BASE DE DONNÉES
# ===============================

# Variables d'environnement pour Render (avec valeurs par défaut pour votre local)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/c.i.c_gestion_stock?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}

# Pilote JDBC pour MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# =   PARAMÈTRES JPA / HIBERNATE
# ===============================

# Dialecte SQL utilisé par Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Création automatique du schéma (update va créer vos tables sur FreeDB au démarrage)
spring.jpa.hibernate.ddl-auto=none

# Afficher les requêtes SQL dans la console
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# =   PARAMÈTRES DU SERVEUR EMBARQUÉ
# ===============================

# Render injecte dynamiquement son propre PORT en production
server.port=${PORT:8080}